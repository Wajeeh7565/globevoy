name: GV-ACCOUNT-705C-R4 Saved Trips CRUD CORS

on:
  pull_request:
    branches: [staging]
    paths:
      - 'backend/staging-lambda-702d.js'
      - 'backend/validation/validate-gv-account-705c-r4.js'
      - '.github/workflows/validate-705c-r4.yml'
  push:
    branches: [staging]
    paths:
      - 'backend/staging-lambda-702d.js'
      - 'backend/validation/validate-gv-account-705c-r4.js'
      - '.github/workflows/validate-705c-r4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-account-705c-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check backend/staging-lambda-702d.js
          node --check backend/validation/validate-gv-account-705c-r4.js
      - name: Validate staging-only saved-trip CRUD CORS
        run: node backend/validation/validate-gv-account-705c-r4.js
      - name: Preserve account regressions
        run: |
          node backend/validation/validate-gv-account-705b-r3.js
          node backend/validation/validate-gv-account-705c.js
          node backend/validation/validate-gv-account-705c-r2.js
          node backend/validation/validate-gv-account-705c-r3.js
