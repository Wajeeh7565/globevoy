name: GV-PERF Apply Pre-Rescue Diagnostic

on:
  push:
    branches:
      - 'feature/gv-perf-r1-pre-rescue-diagnostic'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stop when already patched
        id: already
        shell: bash
        run: |
          if grep -q "GV-PERF-R1 staging diagnostic only" backend/services/public-live-fare-pilot-684a.js; then
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply exact source patch
        if: steps.already.outputs.patched != 'true'
        run: node backend/patch-gv-perf-r1-pre-rescue-diagnostic.js

      - name: Syntax check changed runtime files
        if: steps.already.outputs.patched != 'true'
        run: |
          node --check backend/services/public-live-fare-pilot-684a.js
          node --check backend/services/affordable-flight-discovery-684b.js

      - name: Verify diagnostic is response-only and bounded
        if: steps.already.outputs.patched != 'true'
        shell: bash
        run: |
          grep -q "Symbol.for('globevoy.pre-rescue-live-fare-diagnostic-684a')" backend/services/public-live-fare-pilot-684a.js
          grep -q "preLiveSelectionDiagnostic" backend/services/affordable-flight-discovery-684b.js
          grep -q "selectedFlightFallbackMode: eligibility.selectedFlightFallback === true" backend/services/affordable-flight-discovery-684b.js
          if grep -E "createOrder|createPayment|ticketingCapability: true|bookingCapability: true" backend/services/public-live-fare-pilot-684a.js backend/services/affordable-flight-discovery-684b.js; then
            echo "Unexpected booking/payment capability found."
            exit 1
          fi

      - name: Commit only the two runtime source files
        if: steps.already.outputs.patched != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/public-live-fare-pilot-684a.js backend/services/affordable-flight-discovery-684b.js
          git diff --cached --check
          git commit -m "GV-PERF-R1 expose pre-rescue live-price diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}
