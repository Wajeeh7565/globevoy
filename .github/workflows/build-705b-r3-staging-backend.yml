name: Build GV-ACCOUNT-705B-R3 Staging Backend

on:
  pull_request:
    branches: [staging]
    paths:
      - 'backend/services/accounts/auth/staging-cognito-auth-705b-r3.js'
      - 'backend/staging-lambda-702d.js'
      - 'backend/validate-gv-account-705b-r3.js'
      - '.github/workflows/build-705b-r3-staging-backend.yml'
  push:
    branches: [staging]
    paths:
      - 'backend/services/accounts/auth/staging-cognito-auth-705b-r3.js'
      - 'backend/staging-lambda-702d.js'
      - 'backend/validate-gv-account-705b-r3.js'
      - '.github/workflows/build-705b-r3-staging-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-account-705b-r3-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate account runtime and current provider baselines
        run: |
          node .github/scripts/validate-repo.mjs
          node backend/validate-gv-flight-703e.js
          node backend/validate-gv-hotel-704a.js
          node backend/validate-gv-account-705a.js
          node backend/validate-gv-account-705b.js
          node backend/validate-gv-account-705b-r3.js

      - name: Syntax checks
        run: |
          node --check backend/staging-lambda-702d.js
          node --check backend/services/accounts/auth/staging-cognito-auth-705b-r3.js
          node --check backend/validate-gv-account-705b-r3.js

      - name: Build exact Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="globevoy-staging-backend-705b-r3-${GITHUB_SHA::12}.zip"
          (
            cd backend
            zip -q -r "../dist/${artifact}" .
          )
          test -f "dist/${artifact}"
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/accounts/auth/staging-cognito-auth-705b-r3.js'
          unzip -l "dist/${artifact}" | grep -q 'validate-gv-account-705b-r3.js'
          unzip -l "dist/${artifact}" | grep -q 'services/staging-duffel-shared-budget-703c.js'
          unzip -l "dist/${artifact}" | grep -q 'services/staging-duffel-two-adult-703e.js'
          bytes=$(stat -c%s "dist/${artifact}")
          test "$bytes" -le 52428800
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256.txt"
          cat > dist/DEPLOYMENT-705B-R3.txt <<EOF
          Globevoy GV-ACCOUNT-705B-R3 staging backend
          Commit: ${GITHUB_SHA}
          Handler: staging-lambda-702d.handler
          Required existing CORS origin: https://staging.dy4fw8gx1ccie.amplifyapp.com/
          Adds only staging GET /api/account/session and X-Globevoy-Staging-Account.
          Verifies Cognito RS256 signature via the fixed staging JWKS, issuer, app client, token_use=access, expiry and globevoy/trips.write scope.
          No client secret. No DynamoDB. No production change. No booking/payment/order/ticketing change.
          Existing 703B/703C/703D/703E flight protections remain packaged.
          Deployment must be code-only; do not add Cognito secrets to Lambda environment variables.
          Rollback: restore the prior verified staging Lambda ZIP. Cognito staging resources can remain for later use.
          EOF
          echo "Built ${artifact} (${bytes} bytes)"

      - name: Upload exact staging backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: globevoy-staging-backend-705b-r3
          path: dist/*
          if-no-files-found: error
          retention-days: 14
