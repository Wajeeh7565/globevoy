name: Full website Docker demo
on:
  pull_request:
    branches: [main, codex/gv-docker-002-full-website-fargate]
    paths:
      - 'Dockerfile.fargate-demo*'
      - 'backend/**'
      - 'frontend/**'
      - 'web/**'
      - 'ops/docker/**'
      - 'ops/frontend/**'
      - 'tests/backend/full-site-demo.test.cjs'
      - 'tests/frontend/full-site-demo-browser.test.cjs'
      - 'tests/frontend/classic-save-browser.test.cjs'
      - 'tests/frontend/leaflet-demo-browser.test.cjs'
      - 'tests/release/docker*.test.mjs'
      - '.github/workflows/docker-demo.yml'
permissions:
  contents: read
jobs:
  local-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [isolated, production, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web --no-audit --no-fund
      - run: cd web && npx playwright install --with-deps chromium
      - run: node ops/docker/cache-map-test-assets.mjs
        if: matrix.target == 'isolated'
      - run: docker build --platform linux/amd64 --build-arg GLOBEVOY_LAMBDA_TARGET=${{ matrix.target }} -t globevoy-full-demo -f Dockerfile.fargate-demo .
      - name: Start limited local container
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            production) origin=https://globevoy.com ;;
            staging) origin=https://staging.dy4fw8gx1ccie.amplifyapp.com ;;
            isolated) origin=http://127.0.0.1:18787 ;;
          esac
          docker run -d --name gv-full-validation --cpus=0.25 --memory=512m -e GLOBEVOY_DEMO_ORIGIN="$origin" -p 127.0.0.1:18787:8787 globevoy-full-demo
      - name: Inspect actual composed artifact and HTTP/browser routes
        env:
          GLOBEVOY_DEMO_TEST_URL: http://127.0.0.1:18787
          GLOBEVOY_DOCKER_ARTIFACT: .cache/fargate-demo-site
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p .cache/fargate-demo-site
          docker cp gv-full-validation:/app/.cache/fargate-demo-site/. .cache/fargate-demo-site
          node --test tests/release/docker-artifact.test.mjs
          if [ "$TARGET" = isolated ]; then node scripts/run-tests.mjs demo demo-browser; fi
          if [ "$TARGET" = production ]; then GLOBEVOY_TEST_FRONTEND_ROOT=.cache/fargate-demo-site node scripts/run-tests.mjs browser; fi
      - name: Container health and logs
        run: |
          docker logs gv-full-validation
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gv-full-validation)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Stop local validation container
        if: always()
        run: docker rm -f gv-full-validation || true
