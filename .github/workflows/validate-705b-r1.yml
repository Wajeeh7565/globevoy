name: GV-ACCOUNT-705B-R2 Cognito CloudShell compatibility

on:
  pull_request:
    branches: [staging]
    paths:
      - 'ops/GV-ACCOUNT-705B-Bootstrap-Staging-Cognito.sh'
      - '.github/workflows/validate-705b-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n ops/GV-ACCOUNT-705B-Bootstrap-Staging-Cognito.sh

      - name: Require proven Cognito ListUserPools service page size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('ops/GV-ACCOUNT-705B-Bootstrap-Staging-Cognito.sh').read_text()
          expected = 'aws cognito-idp list-user-pools --max-results 60 --region "$REGION" --output json'
          assert expected in text, 'ListUserPools must match the command proven in real AWS CloudShell'
          line = next(line for line in text.splitlines() if 'aws cognito-idp list-user-pools' in line)
          assert '--max-items' not in line, 'CloudShell rejects --max-items combined with this ListUserPools call'
          print('GV-ACCOUNT-705B-R2 CloudShell ListUserPools compatibility PASS')
          PY

      - name: Preserve 705B staging-only safety boundary
        shell: bash
        run: |
          node backend/validation/validate-gv-account-705b.js
          ! grep -Eq 'aws[[:space:]]+(lambda|amplify|dynamodb|iam|cloudformation)' ops/GV-ACCOUNT-705B-Bootstrap-Staging-Cognito.sh
          ! grep -Eq 'aws[[:space:]]+cognito-idp[[:space:]]+(delete-|update-)' ops/GV-ACCOUNT-705B-Bootstrap-Staging-Cognito.sh
