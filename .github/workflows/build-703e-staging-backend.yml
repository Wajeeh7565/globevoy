name: GV-FLIGHT-703E Staging Backend Package

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'backend/services/providers/flights/duffel/duffel-adult-scope-703e.js'
      - 'backend/services/providers/flights/duffel/staging/staging-duffel-two-adult-703e.js'
      - 'backend/services/providers/flights/duffel/duffel-live-adapter-683d.js'
      - 'backend/services/providers/flights/flight-provider-contract-683c.js'
      - 'backend/services/domain/pricing/traveller-pricing.js'
      - 'backend/services/domain/live-fares/public-live-fare-pilot-684a.js'
      - 'backend/services/domain/live-fares/affordable-flight-discovery-684b.js'
      - 'backend/services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js'
      - 'backend/services/providers/flights/duffel/staging/staging-duffel-shared-budget-703c.js'
      - 'backend/services/providers/flights/staging/staging-affordable-flight-five-origin-703d.js'
      - 'backend/generated-tour.js'
      - 'backend/staging-lambda-702d.js'
      - 'backend/validate-gv-flight-703b.js'
      - 'backend/validate-gv-flight-703c.js'
      - 'backend/validate-gv-flight-703d.js'
      - 'backend/validate-gv-flight-703e.js'
      - '.github/workflows/build-703e-staging-backend.yml'
      - 'docs/GV-FLIGHT-703E.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package 703E staging Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production baseline and 703 flight gates
        run: |
          node .github/scripts/validate-repo.mjs
          node backend/validate-gv-rec-687b-p3.js
          node backend/validate-gv-flight-703b.js
          node backend/validate-gv-flight-703c.js
          node backend/validate-gv-flight-703d.js
          node backend/validate-gv-flight-703e.js

      - name: Syntax checks
        run: |
          node --check backend/lambda.js
          node --check backend/generated-tour.js
          node --check backend/staging-lambda-702d.js
          node --check backend/services/providers/flights/duffel/duffel-adult-scope-703e.js
          node --check backend/services/providers/flights/duffel/staging/staging-duffel-two-adult-703e.js
          node --check backend/services/providers/flights/duffel/duffel-live-adapter-683d.js
          node --check backend/services/providers/flights/flight-provider-contract-683c.js
          node --check backend/services/domain/pricing/traveller-pricing.js
          node --check backend/services/domain/live-fares/public-live-fare-pilot-684a.js
          node --check backend/services/domain/live-fares/affordable-flight-discovery-684b.js
          node --check backend/validate-gv-flight-703e.js

      - name: Build 703E staging ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="globevoy-staging-backend-703e-${GITHUB_SHA::12}.zip"
          (
            cd backend
            zip -q -r "../dist/${artifact}" .
          )
          test -f "dist/${artifact}"
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/duffel-adult-scope-703e.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/staging/staging-duffel-two-adult-703e.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/duffel-live-adapter-683d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/domain/pricing/traveller-pricing.js'
          unzip -l "dist/${artifact}" | grep -q 'services/domain/live-fares/public-live-fare-pilot-684a.js'
          unzip -l "dist/${artifact}" | grep -q 'services/domain/live-fares/affordable-flight-discovery-684b.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/staging/staging-duffel-shared-budget-703c.js'
          unzip -l "dist/${artifact}" | grep -q 'validate-gv-flight-703e.js'
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256.txt"
          cat > dist/DEPLOYMENT-703E.txt <<EOF2
          Globevoy GV-FLIGHT-703E staging backend artifact
          Commit: ${GITHUB_SHA}
          Handler: staging-lambda-702d.handler
          Required origin: CORS_ORIGIN=https://staging.dy4fw8gx1ccie.amplifyapp.com/
          Final-schedule and affordable-discovery origins remain: YYZ,JFK,LAX,DUB,DXB
          Staging adult scope: one or two adults only; children and infants remain unsupported.
          Duffel offer total_amount is treated as the provider party total for all requested passengers and is applied exactly once.
          703C shared physical Duffel request cap per staging HTTP request remains 8.
          684B candidate cap remains 2; maximum flight legs remains 3.
          Exact-date, complete-LIVE-evidence, lowest-cost-ground preservation and no-booking/payment/order/ticketing safeguards remain unchanged.
          The separate 683H flexible-date P2 optimizer remains single-adult-only.
          No new AWS environment variable is required for 703E; the max-adult key is injected only inside the staging process.
          703E does not enable Duffel or add/copy DUFFEL_ACCESS_TOKEN.
          Public staging Duffel traffic remains off unless the pre-existing live provider gates are separately enabled for operator-only QA.
          Production/main is not changed by this staging artifact.
          Rollback: restore the verified 703D staging backend ZIP. No 703E AWS environment variable needs removal.
          Do not deploy this staging QA handler to production.
          EOF2

      - name: Upload 703E staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: globevoy-staging-backend-703e
          path: dist/*
          if-no-files-found: error
          retention-days: 14
