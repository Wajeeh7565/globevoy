name: GV-FLIGHT-703C Staging Backend Package

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'backend/services/providers/flights/duffel/staging/staging-duffel-shared-budget-703c.js'
      - 'backend/services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js'
      - 'backend/staging-lambda-702d.js'
      - 'backend/validate-gv-flight-703b.js'
      - 'backend/validate-gv-flight-703c.js'
      - '.github/workflows/build-703c-staging-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package 703C staging Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production baseline and 703 flight gates
        run: |
          node .github/scripts/validate-repo.mjs
          node backend/validate-gv-rec-687b-p3.js
          node backend/validate-gv-flight-703b.js
          node backend/validate-gv-flight-703c.js

      - name: Syntax checks
        run: |
          node --check backend/lambda.js
          node --check backend/staging-lambda.js
          node --check backend/staging-lambda-702d.js
          node --check backend/services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js
          node --check backend/services/providers/flights/duffel/staging/staging-duffel-shared-budget-703c.js
          node --check backend/validate-gv-flight-703c.js

      - name: Build 703C staging ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="globevoy-staging-backend-703c-${GITHUB_SHA::12}.zip"
          (
            cd backend
            zip -q -r "../dist/${artifact}" .
          )
          test -f "dist/${artifact}"
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/staging/staging-duffel-shared-budget-703c.js'
          unzip -l "dist/${artifact}" | grep -q 'validate-gv-flight-703c.js'
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256.txt"
          cat > dist/DEPLOYMENT-703C.txt <<EOF
          Globevoy GV-FLIGHT-703C staging backend artifact
          Commit: ${GITHUB_SHA}
          Handler: staging-lambda-702d.handler
          Required origin: CORS_ORIGIN=https://staging.dy4fw8gx1ccie.amplifyapp.com/
          703B final-schedule origins: YYZ,JFK,LAX,DUB,DXB
          703C shared physical Duffel request cap per staging HTTP request: 8
          No new AWS environment variable is required for 703C.
          703C does not enable Duffel or add/copy DUFFEL_ACCESS_TOKEN.
          684B affordable-flight discovery remains YYZ-only.
          Public staging Duffel traffic remains off unless the pre-existing live provider gates are separately enabled.
          Rollback: restore the prior staging backend ZIP. No 703C environment variable needs removal.
          Do not deploy this staging QA handler to production.
          EOF

      - name: Upload 703C staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: globevoy-staging-backend-703c
          path: dist/*
          if-no-files-found: error
          retention-days: 14
