name: Build Globevoy Staging Backend

on:
  push:
    branches:
      - feature/gv-platform-700a-staging-api
  pull_request:
    branches:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/build-staging-backend.yml'
      - '.github/scripts/validate-repo.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-staging-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package staging Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate repository safety
        run: node .github/scripts/validate-repo.mjs

      - name: Validate verified production backend remains green
        run: |
          node backend/validate-gv-rec-687b-p3.js
          node backend/validate-gv-rec-687b.js

      - name: Validate isolated staging wrapper
        run: node backend/validate-gv-platform-700a-staging-api.js

      - name: Validate worldwide registry staging API
        run: |
          node backend/validate-gv-data-701a.js
          node backend/validate-gv-data-701b.js

      - name: Validate global recommendation coverage audit
        run: node backend/validate-gv-rec-702a.js

      - name: Validate freshness-aware global recovery priority
        run: |
          node backend/validate-gv-rec-702b.js
          node backend/validate-gv-rec-702b-r1.js

      - name: Validate bounded provider recovery Smoke10 plan
        run: node backend/validate-gv-rec-702c.js

      - name: Validate reviewed recovery projection
        run: node backend/validate-gv-rec-702c-r2.js

      - name: Validate staging-only reviewed recovery QA
        run: node backend/validate-gv-rec-702d.js

      - name: Validate curated 1000-city staging route surface
        run: node backend/validate-gv-rec-702d-r1.js

      - name: Validate reviewed 439-to-441 activation candidate
        run: node backend/validate-gv-rec-702e.js

      - name: Validate staging-only high-confidence airport overlay
        run: node backend/validate-gv-rec-702f-d.js

      - name: Validate staging five-origin final-live policy
        run: node backend/validate-gv-flight-703b.js

      - name: Validate GV-PERF-R5 bounded rescue ordering
        run: node backend/validate-gv-perf-r5.test.js

      - name: Syntax checks
        run: |
          node --check backend/lambda.js
          node --check backend/staging-lambda.js
          node --check backend/staging-lambda-702d.js
          node --check backend/generated-tour.js
          node --check backend/services/domain/live-fares/affordable-flight-discovery-684b.js
          node --check backend/validate-gv-perf-r5.test.js
          node --check backend/services/domain/routing/route-diversity-687b.js
          node --check backend/services/worldwide-city-registry-701a.js
          node --check backend/services/admin/audits/global-recommendation-coverage-702a.js
          node --check backend/services/admin/audits/global-recovery-priority-702b.js
          node --check backend/services/admin/audits/global-provider-recovery-smoke-plan-702c.js
          node --check backend/services/cities/recovery/reviewed-recovery-overlay-702c-r2.js
          node --check backend/services/staging-reviewed-recovery-702d.js
          node --check backend/services/cities/recovery/reviewed-activation-promotion-702e.js
          node --check backend/services/staging-gateway-foundation-702f-d.js
          node --check backend/services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js
          node --check backend/validate-gv-data-701b.js
          node --check backend/validate-gv-rec-702a.js
          node --check backend/validate-gv-rec-702b.js
          node --check backend/validate-gv-rec-702b-r1.js
          node --check backend/validate-gv-rec-702c.js
          node --check backend/validate-gv-rec-702c-r2.js
          node --check backend/validate-gv-rec-702d.js
          node --check backend/validate-gv-rec-702d-r1.js
          node --check backend/validate-gv-rec-702e.js
          node --check backend/validate-gv-rec-702f-d.js
          node --check backend/validate-gv-flight-703b.js

      - name: Build Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="globevoy-staging-backend-${GITHUB_SHA::12}.zip"
          (
            cd backend
            zip -q -r "../dist/${artifact}" .
          )
          test -f "dist/${artifact}"
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda.js'
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'lambda.js'
          unzip -l "dist/${artifact}" | grep -q 'generated-tour.js'
          unzip -l "dist/${artifact}" | grep -q 'services/worldwide-city-registry-701a.js'
          unzip -l "dist/${artifact}" | grep -q 'services/admin/audits/global-recommendation-coverage-702a.js'
          unzip -l "dist/${artifact}" | grep -q 'services/admin/audits/global-recovery-priority-702b.js'
          unzip -l "dist/${artifact}" | grep -q 'services/admin/audits/global-provider-recovery-smoke-plan-702c.js'
          unzip -l "dist/${artifact}" | grep -q 'services/cities/recovery/reviewed-recovery-overlay-702c-r2.js'
          unzip -l "dist/${artifact}" | grep -q 'services/staging-reviewed-recovery-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/cities/recovery/reviewed-activation-promotion-702e.js'
          unzip -l "dist/${artifact}" | grep -q 'services/staging-gateway-foundation-702f-d.js'
          unzip -l "dist/${artifact}" | grep -q 'services/providers/flights/duffel/staging/staging-duffel-five-origin-703b.js'
          unzip -l "dist/${artifact}" | grep -q 'validate-gv-flight-703b.js'
          unzip -l "dist/${artifact}" | grep -q 'data/gv-rec-702c-r2-reviewed-evidence-manifest.json'
          unzip -l "dist/${artifact}" | grep -q 'data/gv-rec-702e-promotion-manifest.json'
          unzip -l "dist/${artifact}" | grep -q 'data/gateway-foundation-corrections-702f-d.json'
          bytes=$(stat -c%s "dist/${artifact}")
          if [ "$bytes" -gt 52428800 ]; then
            echo "Lambda ZIP exceeds the 50 MB direct-upload limit: ${bytes} bytes"
            exit 1
          fi
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256.txt"
          cat > dist/DEPLOYMENT.txt <<EOF
          Globevoy staging backend artifact
          Commit: ${GITHUB_SHA}
          Standard staging handler: staging-lambda.handler
          702D/702F-D/703B QA handler: staging-lambda-702d.handler
          Required staging origin: CORS_ORIGIN=https://staging.dy4fw8gx1ccie.amplifyapp.com/
          702D route-surface QA requires all of:
            ENABLE_VERIFIED_CITY_ACTIVATION_668T=true
            ENABLE_MVP_VALIDATION_REPAIRS_669B=true
            ENABLE_STAGING_REVIEWED_RECOVERY_702D=true
            ENABLE_UNIFIED_CITY_REGISTRY_668A=true
            ENABLE_PROVIDER_MAPPING_COMPLETION_668B=true
          702F-D preferred-airport QA additionally requires:
            ENABLE_STAGING_GATEWAY_FOUNDATION_702F_D=true
          GV-FLIGHT-703B is code-only inside the staging QA wrapper and requires NO new AWS environment variable. With the exact staging CORS origin it installs only this 684A final-schedule origin policy:
            GV_DUFFEL_PUBLIC_PILOT_ORIGINS_684A=YYZ,JFK,LAX,DUB,DXB
          703B does NOT enable Duffel, add/copy DUFFEL_ACCESS_TOKEN, expand 684B discovery, increase request caps, or add booking/payment/ticketing capability.
          684B affordable-flight discovery remains hard-allowlisted to YYZ only.
          Live Duffel execution still requires the pre-existing 684A/683D dependency gates and a live token; those are intentionally NOT enabled by this package.
          The curated route surface remains 1,000 cities. 702D still limits staging QA live eligibility to 439 + 2 reviewed recoveries = 441.
          GV-REC-702F-D changes only nine in-memory staging preferred-airport mappings. It does not modify provider mappings, coordinates, activation, or the committed 1,000-city registry.
          GV-REC-702E is candidate-only. Its service/manifest are packaged for reproducible validation but are NOT imported by Lambda runtime and require NO environment variable.
          Do not treat 702E packaging as production activation approval or deployment.
          Rollback for 703B: restore the prior staging backend artifact. No 703B AWS environment variable needs removal.
          Rollback for 702F-D QA: remove ENABLE_STAGING_GATEWAY_FOUNDATION_702F_D or restore the prior staging backend artifact.
          Rollback for 702D QA: restore handler staging-lambda.handler and remove ENABLE_STAGING_REVIEWED_RECOVERY_702D. Remove the two registry QA flags as well if returning to the earlier candidate surface.
          Do not deploy the 702D/702F-D/703B QA handler to the production Lambda.
          EOF
          echo "Built ${artifact} (${bytes} bytes)"

      - name: Upload staging backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: globevoy-staging-backend
          path: dist/*
          if-no-files-found: error
          retention-days: 14
