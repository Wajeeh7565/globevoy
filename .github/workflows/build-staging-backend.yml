name: Build Globevoy Staging Backend

on:
  push:
    branches:
      - feature/gv-platform-700a-staging-api
  pull_request:
    branches:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/build-staging-backend.yml'
      - '.github/scripts/validate-repo.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-staging-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package staging Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate repository safety
        run: node .github/scripts/validate-repo.mjs

      - name: Validate verified production backend remains green
        run: |
          node backend/validate-gv-rec-687b-p3.js
          node backend/validate-gv-rec-687b.js

      - name: Validate isolated staging wrapper
        run: node backend/validate-gv-platform-700a-staging-api.js

      - name: Validate worldwide registry staging API
        run: |
          node backend/validate-gv-data-701a.js
          node backend/validate-gv-data-701b.js

      - name: Validate global recommendation coverage audit
        run: node backend/validate-gv-rec-702a.js

      - name: Validate freshness-aware global recovery priority
        run: |
          node backend/validate-gv-rec-702b.js
          node backend/validate-gv-rec-702b-r1.js

      - name: Validate bounded provider recovery Smoke10 plan
        run: node backend/validate-gv-rec-702c.js

      - name: Validate reviewed recovery projection
        run: node backend/validate-gv-rec-702c-r2.js

      - name: Validate staging-only reviewed recovery QA
        run: node backend/validate-gv-rec-702d.js

      - name: Validate curated 1000-city staging route surface
        run: node backend/validate-gv-rec-702d-r1.js

      - name: Syntax checks
        run: |
          node --check backend/lambda.js
          node --check backend/staging-lambda.js
          node --check backend/staging-lambda-702d.js
          node --check backend/generated-tour.js
          node --check backend/services/route-diversity-687b.js
          node --check backend/services/worldwide-city-registry-701a.js
          node --check backend/services/global-recommendation-coverage-702a.js
          node --check backend/services/global-recovery-priority-702b.js
          node --check backend/services/global-provider-recovery-smoke-plan-702c.js
          node --check backend/services/reviewed-recovery-overlay-702c-r2.js
          node --check backend/services/staging-reviewed-recovery-702d.js
          node --check backend/validate-gv-data-701b.js
          node --check backend/validate-gv-rec-702a.js
          node --check backend/validate-gv-rec-702b.js
          node --check backend/validate-gv-rec-702b-r1.js
          node --check backend/validate-gv-rec-702c.js
          node --check backend/validate-gv-rec-702c-r2.js
          node --check backend/validate-gv-rec-702d.js
          node --check backend/validate-gv-rec-702d-r1.js

      - name: Build Lambda ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="globevoy-staging-backend-${GITHUB_SHA::12}.zip"
          (
            cd backend
            zip -q -r "../dist/${artifact}" .
          )
          test -f "dist/${artifact}"
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda.js'
          unzip -l "dist/${artifact}" | grep -q 'staging-lambda-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'lambda.js'
          unzip -l "dist/${artifact}" | grep -q 'generated-tour.js'
          unzip -l "dist/${artifact}" | grep -q 'services/worldwide-city-registry-701a.js'
          unzip -l "dist/${artifact}" | grep -q 'services/global-recommendation-coverage-702a.js'
          unzip -l "dist/${artifact}" | grep -q 'services/global-recovery-priority-702b.js'
          unzip -l "dist/${artifact}" | grep -q 'services/global-provider-recovery-smoke-plan-702c.js'
          unzip -l "dist/${artifact}" | grep -q 'services/reviewed-recovery-overlay-702c-r2.js'
          unzip -l "dist/${artifact}" | grep -q 'services/staging-reviewed-recovery-702d.js'
          unzip -l "dist/${artifact}" | grep -q 'data/gv-rec-702c-r2-reviewed-evidence-manifest.json'
          bytes=$(stat -c%s "dist/${artifact}")
          if [ "$bytes" -gt 52428800 ]; then
            echo "Lambda ZIP exceeds the 50 MB direct-upload limit: ${bytes} bytes"
            exit 1
          fi
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256.txt"
          cat > dist/DEPLOYMENT.txt <<EOF
          Globevoy staging backend artifact
          Commit: ${GITHUB_SHA}
          Standard staging handler: staging-lambda.handler
          702D QA handler: staging-lambda-702d.handler
          Required staging origin: CORS_ORIGIN=https://staging.dy4fw8gx1ccie.amplifyapp.com/
          702D route-surface QA requires all of:
            ENABLE_VERIFIED_CITY_ACTIVATION_668T=true
            ENABLE_MVP_VALIDATION_REPAIRS_669B=true
            ENABLE_STAGING_REVIEWED_RECOVERY_702D=true
            ENABLE_UNIFIED_CITY_REGISTRY_668A=true
            ENABLE_PROVIDER_MAPPING_COMPLETION_668B=true
          The curated route surface is 1,000 cities, but verified activation still limits staging QA to 439 + 2 reviewed recoveries = 441.
          Rollback: restore handler staging-lambda.handler and remove ENABLE_STAGING_REVIEWED_RECOVERY_702D. Remove the two registry QA flags as well if returning to the earlier candidate surface.
          Do not deploy the 702D QA handler to the production Lambda.
          EOF
          echo "Built ${artifact} (${bytes} bytes)"

      - name: Upload staging backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: globevoy-staging-backend
          path: dist/*
          if-no-files-found: error
          retention-days: 14
