name: GV-WEB-706R React Next Foundation

on:
  pull_request:
    branches: [staging]
    paths:
      - 'web/**'
      - 'amplify.yml'
      - 'backend/staging-lambda-702d.js'
      - 'backend/services/staging-booking-revalidation-707b.js'
      - 'backend/validate-gv-web-707b.js'
      - 'docs/GV-WEB-706R-MIGRATION-PLAN.md'
      - '.github/workflows/validate-706r.yml'
      - '.github/workflows/validate-707a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json

      - name: Enforce approved React migration boundary
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed"
          if [ -f backend/validate-gv-web-707b.js ]; then
            if printf '%s\n' "$changed" | grep -Eq '^frontend/'; then
              echo '707B must not modify the proven legacy frontend.' >&2
              exit 1
            fi
            unexpected_backend="$(printf '%s\n' "$changed" | grep '^backend/' | grep -Ev '^(backend/staging-lambda-702d\.js|backend/services/staging-booking-revalidation-707b\.js|backend/validate-gv-web-707b\.js)$' || true)"
            if [ -n "$unexpected_backend" ]; then
              echo '707B may change only its staging wrapper/service/validator backend files:' >&2
              printf '%s\n' "$unexpected_backend" >&2
              exit 1
            fi
          elif [ -f web/validation/validate-gv-web-707a.mjs ]; then
            if printf '%s\n' "$changed" | grep -Eq '^(frontend|backend)/'; then
              echo 'React migration must not modify the proven frontend or backend.' >&2
              exit 1
            fi
          fi

      - name: Install pinned framework dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency graph lock
        run: echo '12f0fe80be5db2d1a7e18784eaf7a5e7f04ade17cf84b91c78a2dde5ec20f2c0  package-lock.json' | sha256sum -c -

      - name: TypeScript strict validation
        run: npm run typecheck

      - name: Validate approved React successor contracts
        working-directory: .
        run: |
          if [ -f web/validation/validate-gv-web-707a.mjs ]; then
            node web/validation/validate-gv-web-707a.mjs
          fi
          if [ -f backend/validate-gv-web-707b.js ]; then
            node backend/validate-gv-web-707b.js
          fi

      - name: Build static Next.js application
        run: npm run build

      - name: Verify static export and migration boundary
        run: |
          test -f out/index.html
          grep -q 'GV-WEB-706R' app/page.tsx
          grep -q "output: 'export'" next.config.ts
          grep -q '15.5.21' package.json
          grep -q '19.2.7' package.json
          grep -q '22.20.1' package.json
          grep -q '19.2.18' package.json
          grep -q '19.2.4' package.json
          grep -q '5.9.3' package.json
          ! grep -R -E 'DUFFEL_ACCESS_TOKEN|AWS_SECRET_ACCESS_KEY|client_secret|Cognito.*secret' app components lib package.json next.config.ts
          if [ -f app/my-trips/page.tsx ]; then
            test -f out/account/index.html
            test -f out/my-trips/index.html
            grep -q "basePath: '/react'" next.config.ts
            grep -q '/react/_next/' out/account/index.html
            grep -q '/react/_next/' out/my-trips/index.html
          fi
          if [ -f app/booking/page.tsx ]; then
            test -f out/booking/index.html
            grep -q '/react/_next/' out/booking/index.html
          fi

      - name: Verify versioned Amplify composite artifact
        working-directory: .
        run: |
          test -f amplify.yml
          grep -q 'GV-WEB-707A-R1 composite staging build' amplify.yml
          grep -q 'baseDirectory: amplify-publish' amplify.yml
          grep -q 'cp -a frontend/. amplify-publish/' amplify.yml
          grep -q 'cp -a web/out/. amplify-publish/react/' amplify.yml
          rm -rf amplify-publish
          mkdir -p amplify-publish/react
          cp -a frontend/. amplify-publish/
          cp -a web/out/. amplify-publish/react/
          test -f amplify-publish/index.html
          test -f amplify-publish/react/index.html
          test -f amplify-publish/react/account/index.html
          test -f amplify-publish/react/my-trips/index.html
          grep -q '/react/_next/' amplify-publish/react/index.html
          grep -q '/react/_next/' amplify-publish/react/account/index.html
          grep -q '/react/_next/' amplify-publish/react/my-trips/index.html
          if [ -f web/app/booking/page.tsx ]; then
            test -f amplify-publish/react/booking/index.html
            grep -q '/react/_next/' amplify-publish/react/booking/index.html
          fi

      - name: Preserve account, booking and Duffel regressions for React successors
        working-directory: .
        run: |
          if [ -f web/validation/validate-gv-web-707a.mjs ]; then
            node backend/validate-gv-account-705b-r3.js
            node backend/validate-gv-account-705c.js
            node backend/validate-gv-account-705c-r4.js
            node backend/validate-gv-book-706a.js
          fi
          if [ -f backend/validate-gv-web-707b.js ]; then
            node backend/validate-gv-flight-703c.js
            node backend/validate-gv-flight-703e.js
          fi

      - name: Capture generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: gv-web-706r-package-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 7
