name: GV-FLIGHT-703A Duffel Expansion Audit

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'backend/data/gv-flight-703a-duffel-expansion-audit.json'
      - 'backend/validation/validate-gv-flight-703a.js'
      - 'backend/services/providers/flights/duffel/duffel-live-adapter-683d.js'
      - 'backend/services/providers/flights/duffel/duffel-p2-staging-683h.js'
      - 'backend/services/domain/live-fares/public-live-fare-pilot-684a.js'
      - 'backend/services/domain/live-fares/affordable-flight-discovery-684b.js'
      - 'backend/services/domain/tours/generated-tour.js'
      - '.github/workflows/validate-703a.yml'
      - 'docs/GV-FLIGHT-703A.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate Duffel expansion architecture audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax and deterministic audit validation
        run: |
          node --check backend/validation/validate-gv-flight-703a.js
          node backend/validation/validate-gv-flight-703a.js

      - name: Confirm research-only boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E "require\(['\"]\./?(data/)?gv-flight-703a-duffel-expansion-audit|GV-FLIGHT-703A" \
              backend/lambda.js backend/staging-lambda.js backend/staging-lambda-702d.js backend/services/domain/tours/generated-tour.js backend/services/providers/flights/duffel/duffel-live-adapter-683d.js backend/services/providers/flights/duffel/duffel-p2-staging-683h.js backend/services/domain/live-fares/public-live-fare-pilot-684a.js backend/services/domain/live-fares/affordable-flight-discovery-684b.js; then
            echo "703A runtime wiring detected."
            exit 1
          fi
          if grep -E "aws[[:space:]]+(lambda|amplify|cloudformation)|amplify[[:space:]]+publish" .github/workflows/validate-703a.yml; then
            echo "Deployment command found in 703A workflow."
            exit 1
          fi
          echo "PASS - 703A is research-only and deployment-free."
