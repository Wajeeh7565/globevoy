name: GV-PERF 684B to 684A Reuse Diagnostic

on:
  push:
    branches:
      - 'feature/gv-perf-684b-684a-reuse-diagnostic'
  pull_request:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate 684B live-evidence reuse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check diagnostics
        run: |
          node --check backend/validate-gv-perf-684b-684a-reuse.js
          node --check backend/validate-gv-perf-planning-live-gap.js

      - name: Run 684B to final 684A reuse diagnostic
        run: node backend/validate-gv-perf-684b-684a-reuse.js

      - name: Run planning to live-price gap diagnostic
        run: node backend/validate-gv-perf-planning-live-gap.js

      - name: Confirm diagnostics are deployment-free
        shell: bash
        run: |
          if grep -E "aws[[:space:]]+(lambda|amplify|cloudformation)[[:space:]].*(update|create|start-deployment|deploy)|amplify[[:space:]]+publish" \
            backend/validate-gv-perf-684b-684a-reuse.js \
            backend/validate-gv-perf-planning-live-gap.js; then
            echo "Deployment command found inside diagnostic."
            exit 1
          fi
          echo "PASS - diagnostics contain no AWS deployment command."
