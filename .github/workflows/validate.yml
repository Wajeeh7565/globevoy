name: Globevoy Validation

on:
  push:
    branches:
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current Globevoy baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show Node version
        run: node --version

      - name: Repository safety guard
        run: node .github/scripts/validate-repo.mjs

      - name: Backend 687B-P3 exact validation
        run: node backend/validate-gv-rec-687b-p3.js

      - name: Backend 687B recommendation regression
        run: node backend/validate-gv-rec-687b.js

      - name: Worldwide registry 701A validation
        run: node backend/validate-gv-data-701a.js

      - name: Worldwide staging API 701B validation
        run: node backend/validate-gv-data-701b.js

      - name: Worldwide frontend contract 701C validation
        run: node frontend/validation/validate-gv-data-701c.js

      - name: Global recommendation coverage 702A validation
        run: node backend/validate-gv-rec-702a.js

      - name: Global recovery priority 702B validation
        run: node backend/validate-gv-rec-702b.js

      - name: Frontend 687B exact + regression validation
        run: node frontend/validation/validate-gv-rec-687b-frontend.js

      - name: Current runtime syntax checks
        shell: bash
        run: |
          node --check backend/lambda.js
          node --check backend/staging-lambda.js
          node --check backend/generated-tour.js
          node --check backend/services/route-diversity-687b.js
          node --check backend/services/worldwide-city-registry-701a.js
          node --check backend/services/global-recommendation-coverage-702a.js
          node --check backend/services/global-recovery-priority-702b.js
          node --check backend/validate-gv-data-701a.js
          node --check backend/validate-gv-data-701b.js
          node --check backend/validate-gv-rec-702a.js
          node --check backend/validate-gv-rec-702b.js
          node --check frontend/runtime/api-client.js
          node --check frontend/validation/validate-gv-data-701c.js
          node --check frontend/scripts/multicity-visualizer-687b.js

      - name: Confirm CI is deployment-free
        shell: bash
        run: |
          if grep -R -E "aws[[:space:]]+(lambda|amplify|cloudformation)[[:space:]].*(update|create|start-deployment|deploy)|amplify[[:space:]]+publish" .github/workflows .github/scripts; then
            echo "Deployment command found inside validation automation."
            exit 1
          fi
          echo "PASS - validation workflow contains no AWS deployment command."
